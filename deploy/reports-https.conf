# Add to nginx-prod.conf after the certificate exists.
server {
    listen 443 ssl;
    http2 on;
    server_name reports.ultex.ma;

    ssl_certificate /etc/letsencrypt/live/reports.ultex.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reports.ultex.ma/privkey.pem;
    client_max_body_size 25m;

    location / {
        proxy_pass http://172.17.0.1:8310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
