name: ulting-reports

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env.local
        format: raw
    environment:
      ULTING_DATA_DIR: /data
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: https://reports.ultex.ma
    volumes:
      - ulting_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Reachable by the existing nginx-proxy through the host bridge only.
      - "172.17.0.1:8310:80"
    restart: unless-stopped

volumes:
  ulting_data:
